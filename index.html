<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff6e9"><meta name="apple-mobile-web-app-capable" content="yes">
<title>DodiWords — Little words, big wonders</title>
<style>
:root{font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:#55483d;background:#fff6e9}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 20% 5%,#ffe7df,transparent 40%),radial-gradient(circle at 85% 90%,#e1f2df,transparent 45%),#fff6e9}
main{max-width:740px;margin:auto;padding:24px 18px 48px}header{text-align:center;margin:10px 0 26px}h1{font-size:clamp(2.2rem,9vw,3.6rem);margin:0;color:#e17c70;letter-spacing:-2px}header p{margin:4px;color:#89766b;font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tile{border:0;border-radius:28px;aspect-ratio:1/1;box-shadow:0 7px 0 #0000000b,0 14px 26px #7d695519;background:#fff;display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden;touch-action:manipulation;transition:transform .15s}
.tile:active{transform:scale(.94)}.tile:focus-visible,.next:focus-visible{outline:4px solid #dc877a;outline-offset:3px}
.tile .illustration{width:96%;height:96%;display:block;filter:drop-shadow(0 5px 3px #00000008)}.tile .art{font-size:clamp(4.3rem,18vw,8rem);filter:drop-shadow(0 9px 5px #00000013);line-height:1;user-select:none}
.tile.speaking{animation:bounce .32s ease-in-out}.tile:nth-child(4n+1){background:#fce6d9}.tile:nth-child(4n+2){background:#e3f0df}.tile:nth-child(4n+3){background:#e4ebfa}.tile:nth-child(4n){background:#fff0bd}
@keyframes bounce{50%{transform:scale(1.045)}}
.controls{text-align:center;margin:26px 0}.next{font:inherit;border:0;background:#e17c70;color:white;border-radius:999px;padding:16px 34px;font-size:1.2rem;font-weight:800;box-shadow:0 6px 0 #bf6057;cursor:pointer}.next:active{transform:translateY(4px);box-shadow:0 2px 0 #bf6057}
.hint{text-align:center;color:#998579;font-size:.85rem;margin:20px 0}.status{min-height:1.4em;text-align:center;color:#9a6d64;font-size:.9rem}
@media(max-width:360px){.grid{gap:10px}.tile{border-radius:20px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body><main><header><h1>☀️ DodiWords</h1><p>Little words, big wonders ✨</p></header>
<section class="grid" id="grid" aria-label="Picture cards"></section>
<div class="controls"><button class="next" id="next" type="button">More pictures →</button></div>
<p class="status" id="status" role="status" aria-live="polite"></p>
<p class="hint">Tap a picture to hear its English name ♡</p></main>
<script>
"use strict";
// A small, hand-checked vocabulary: each illustration maps to exactly one spoken word.
// Replace emoji with licensed, optimized storybook artwork in a later asset pass.
const words=[
["Cat","🐱"],["Dog","🐶"],["Elephant","🐘"],["Lion","🦁"],["Tiger","🐯"],["Bear","🐻"],["Rabbit","🐰"],["Fox","🦊"],["Panda","🐼"],["Monkey","🐵"],["Giraffe","🦒"],["Zebra","🦓"],["Horse","🐴"],["Cow","🐮"],["Pig","🐷"],["Sheep","🐑"],["Duck","🦆"],["Chicken","🐔"],["Penguin","🐧"],["Owl","🦉"],["Butterfly","🦋"],["Bee","🐝"],["Frog","🐸"],["Turtle","🐢"],["Fish","🐟"],["Whale","🐳"],["Dolphin","🐬"],["Octopus","🐙"],["Crab","🦀"],["Snail","🐌"],["Apple","🍎"],["Banana","🍌"],["Strawberry","🍓"],["Cherry","🍒"],["Pear","🍐"],["Peach","🍑"],["Watermelon","🍉"],["Pineapple","🍍"],["Carrot","🥕"],["Corn","🌽"],["Broccoli","🥦"],["Bread","🍞"],["Cheese","🧀"],["Cake","🎂"],["Cookie","🍪"],["Ice cream","🍦"],["Ball","⚽"],["Teddy bear","🧸"],["Balloon","🎈"],["Kite","🪁"],["Car","🚗"],["Bus","🚌"],["Train","🚂"],["Airplane","✈️"],["Bicycle","🚲"],["Boat","⛵"],["Rocket","🚀"],["House","🏠"],["Tree","🌳"],["Flower","🌻"],["Sun","☀️"],["Moon","🌙"],["Star","⭐"],["Rainbow","🌈"],["Cloud","☁️"],["Snowman","⛄"],["Umbrella","☂️"],["Book","📖"],["Pencil","✏️"],["Clock","⏰"],["Key","🔑"],["Hat","🎩"],["Shoe","👟"],["Sock","🧦"],["Chair","🪑"],["Bed","🛏️"],["Cup","🥤"],["Spoon","🥄"],["Toothbrush","🪥"],["Drum","🥁"],["Guitar","🎸"],["Bell","🔔"],["Heart","❤️"],["Gift","🎁"],["Crown","👑"],["Robot","🤖"],["Dinosaur","🦕"],["Ladybug","🐞"],["Ant","🐜"],["Mouse","🐭"],["Squirrel","🐿️"],["Koala","🐨"],["Camel","🐪"],["Hedgehog","🦔"],["Flamingo","🦩"],["Parrot","🦜"],["Crocodile","🐊"],["Seal","🦭"]
];

const illustrations = {
"Elephant": `<ellipse cx="100" cy="171" rx="59" ry="10" fill="#e4d8c8"/><ellipse cx="102" cy="123" rx="57" ry="47" fill="#aabbd1"/><circle cx="106" cy="76" r="49" fill="#b7c7da"/><ellipse cx="61" cy="79" rx="29" ry="36" fill="#a6b9d0"/><ellipse cx="61" cy="80" rx="19" ry="26" fill="#efb9b4"/><ellipse cx="147" cy="79" rx="29" ry="36" fill="#a6b9d0"/><ellipse cx="147" cy="80" rx="19" ry="26" fill="#efb9b4"/><path d="M112 93 Q135 120 120 145 Q111 155 101 141" fill="none" stroke="#b7c7da" stroke-width="22" stroke-linecap="round"/><circle cx="91" cy="76" r="5" fill="#403a3b"/><circle cx="126" cy="76" r="5" fill="#403a3b"/><circle cx="80" cy="92" r="9" fill="#f3a6a8" opacity=".7"/><ellipse cx="68" cy="160" rx="16" ry="12" fill="#9eb0c7"/><ellipse cx="135" cy="160" rx="16" ry="12" fill="#9eb0c7"/>`,
"Fox": `<ellipse cx="103" cy="173" rx="63" ry="9" fill="#ead7c5"/><path d="M125 119 Q194 94 174 153 Q157 176 129 151" fill="#d9854b"/><ellipse cx="101" cy="128" rx="46" ry="43" fill="#dc8d50"/><path d="M60 58 L62 17 L94 44 L113 44 L146 17 L146 58" fill="#cf7944"/><path d="M68 51 L69 32 L87 48 M120 48 L138 32 L138 51" fill="#f4b7ad"/><path d="M59 66 Q61 33 102 35 Q147 33 150 67 L138 100 Q103 134 68 100Z" fill="#e69353"/><path d="M63 83 Q80 78 102 103 Q126 78 143 83 Q133 119 102 120 Q70 119 63 83" fill="#fff0da"/><circle cx="84" cy="74" r="5" fill="#48372d"/><circle cx="120" cy="74" r="5" fill="#48372d"/><path d="M96 95 L108 95 L102 102Z" fill="#4c3934"/><ellipse cx="82" cy="160" rx="16" ry="11" fill="#c87945"/><ellipse cx="123" cy="160" rx="16" ry="11" fill="#c87945"/>`,
"Bus": `<ellipse cx="105" cy="167" rx="82" ry="9" fill="#e9d6be"/><rect x="28" y="67" width="150" height="88" rx="19" fill="#f7bd4b" stroke="#df9d35" stroke-width="3"/><path d="M44 78 Q44 73 51 73 H152 Q163 73 163 86 V112 H44Z" fill="#a9dce9"/><path d="M83 75 V113 M120 75 V113" stroke="#f3bd51" stroke-width="6"/><rect x="35" y="120" width="136" height="10" rx="5" fill="#e99c42"/><circle cx="65" cy="153" r="19" fill="#454d60"/><circle cx="65" cy="153" r="9" fill="#cfd7dc"/><circle cx="146" cy="153" r="19" fill="#454d60"/><circle cx="146" cy="153" r="9" fill="#cfd7dc"/><circle cx="38" cy="137" r="6" fill="#fff0b2"/><circle cx="168" cy="137" r="6" fill="#e77e65"/>`,
"Strawberry": `<ellipse cx="104" cy="174" rx="58" ry="8" fill="#eadac8"/><path d="M103 51 Q164 40 160 91 Q156 137 104 165 Q52 137 48 91 Q44 40 103 51Z" fill="#ed5b58" stroke="#d94c4a" stroke-width="3"/><path d="M102 54 Q83 33 65 47 L83 65 L57 59 L73 80 L102 67 L131 80 L146 59 L121 65 L140 47 Q121 33 102 54Z" fill="#6d9f5e"/><path d="M103 51 L108 28" stroke="#658d51" stroke-width="6" stroke-linecap="round"/><g fill="#ffdc9c"><ellipse cx="79" cy="89" rx="3" ry="5"/><ellipse cx="111" cy="89" rx="3" ry="5"/><ellipse cx="137" cy="93" rx="3" ry="5"/><ellipse cx="66" cy="112" rx="3" ry="5"/><ellipse cx="95" cy="117" rx="3" ry="5"/><ellipse cx="124" cy="120" rx="3" ry="5"/><ellipse cx="103" cy="144" rx="3" ry="5"/></g>`,
"Dog": `<ellipse cx="102" cy="173" rx="63" ry="9" fill="#e9d7c5"/><ellipse cx="104" cy="133" rx="48" ry="40" fill="#dfaa73"/><ellipse cx="62" cy="72" rx="22" ry="40" fill="#bd8559" transform="rotate(18 62 72)"/><ellipse cx="145" cy="72" rx="22" ry="40" fill="#bd8559" transform="rotate(-18 145 72)"/><circle cx="103" cy="82" r="48" fill="#e9b883"/><ellipse cx="103" cy="107" rx="26" ry="20" fill="#f6dfbe"/><circle cx="85" cy="80" r="5" fill="#453a34"/><circle cx="121" cy="80" r="5" fill="#453a34"/><ellipse cx="103" cy="99" rx="9" ry="6" fill="#4a3b38"/><path d="M103 104 Q102 116 90 113 M103 104 Q105 116 117 113" fill="none" stroke="#6d5145" stroke-width="3"/><ellipse cx="75" cy="160" rx="18" ry="11" fill="#d49c68"/><ellipse cx="132" cy="160" rx="18" ry="11" fill="#d49c68"/>`,
"Ball": `<ellipse cx="103" cy="177" rx="65" ry="8" fill="#e5d8c8"/><circle cx="103" cy="100" r="68" fill="#fff2d2"/><clipPath id="ballclip"><circle cx="103" cy="100" r="68"/></clipPath><g clip-path="url(#ballclip)"><path d="M35 100 L103 100 L68 41 Q36 54 35 100" fill="#f6c855"/><path d="M103 100 L137 41 Q175 64 171 100Z" fill="#83c4e2"/><path d="M103 100 L171 100 Q174 139 136 159Z" fill="#f28c76"/><path d="M103 100 L136 159 Q103 178 69 159Z" fill="#87bba4"/><path d="M103 100 L69 159 Q33 138 35 100Z" fill="#e8b7cf"/><circle cx="103" cy="100" r="16" fill="#fff3dc"/></g><circle cx="103" cy="100" r="68" fill="none" stroke="#e7d7bd" stroke-width="3"/>`,
"Teddy bear": `<ellipse cx="103" cy="177" rx="66" ry="8" fill="#ead8c6"/><circle cx="69" cy="53" r="25" fill="#bb8659"/><circle cx="137" cy="53" r="25" fill="#bb8659"/><circle cx="69" cy="53" r="13" fill="#e6b58a"/><circle cx="137" cy="53" r="13" fill="#e6b58a"/><ellipse cx="103" cy="133" rx="53" ry="44" fill="#bd885d"/><circle cx="103" cy="81" r="49" fill="#c79467"/><ellipse cx="103" cy="101" rx="24" ry="19" fill="#f2d5ac"/><circle cx="86" cy="77" r="5" fill="#3e3530"/><circle cx="121" cy="77" r="5" fill="#3e3530"/><ellipse cx="103" cy="95" rx="8" ry="6" fill="#534038"/><path d="M103 101 Q95 111 88 104 M103 101 Q111 111 118 104" fill="none" stroke="#725244" stroke-width="2.5"/><ellipse cx="66" cy="162" rx="25" ry="17" fill="#b98257"/><ellipse cx="140" cy="162" rx="25" ry="17" fill="#b98257"/><path d="M103 120 L84 112 L83 132Z M103 120 L122 112 L123 132Z" fill="#db6e70"/><circle cx="103" cy="121" r="7" fill="#e17f7e"/>`,
"Apple": `<ellipse cx="104" cy="176" rx="60" ry="8" fill="#ead7c5"/><path d="M104 64 Q71 41 52 70 Q32 105 61 145 Q80 170 103 158 Q128 170 148 145 Q177 104 153 70 Q135 43 104 64Z" fill="#e9605a" stroke="#d74c4a" stroke-width="3"/><path d="M104 65 Q105 47 101 33" fill="none" stroke="#8b6b45" stroke-width="7" stroke-linecap="round"/><path d="M107 47 Q123 18 148 33 Q137 57 107 47Z" fill="#77aa6b"/><path d="M70 82 Q56 104 74 130" fill="none" stroke="#f8a3a0" stroke-width="9" opacity=".55" stroke-linecap="round"/>`
};
function artwork(word){const shapes=illustrations[word];if(!shapes)return null;const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("viewBox","0 0 206 206");svg.setAttribute("aria-hidden","true");svg.classList.add("illustration");svg.innerHTML=shapes;return svg;}

let bag=[],recent=[],voice=null;
const grid=document.getElementById("grid"),status=document.getElementById("status");
function refill(){bag=words.map((_,i)=>i).filter(i=>!recent.includes(i));for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}}
function draw(){if(bag.length<4)refill();grid.replaceChildren();for(let n=0;n<4;n++){const index=bag.pop(),[word,emoji]=words[index];recent.push(index);if(recent.length>16)recent.shift();const button=document.createElement("button");button.className="tile";button.type="button";button.setAttribute("aria-label",word);const art=document.createElement("span");art.className="art";art.textContent=emoji;art.setAttribute("aria-hidden","true");const picture=artwork(word);if(picture){button.append(picture);}else{button.append(art);}button.addEventListener("click",()=>speak(word,button));grid.append(button);}}
function chooseVoice(){if(!("speechSynthesis" in window))return;const voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));voice=voices.find(v=>/Samantha|Karen|Daniel|Serena|Ava/i.test(v.name))||voices.find(v=>v.localService)||voices[0]||null;}
function speak(word,button){if(!("speechSynthesis" in window)){status.textContent="Speech is not supported in this browser.";return;}speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(word);utterance.lang="en-US";utterance.rate=.82;utterance.pitch=1.06;if(voice)utterance.voice=voice;button.classList.remove("speaking");void button.offsetWidth;button.classList.add("speaking");utterance.onend=()=>button.classList.remove("speaking");utterance.onerror=()=>{status.textContent="Please check that your phone is not muted and try again.";button.classList.remove("speaking");};status.textContent="";speechSynthesis.speak(utterance);}
document.getElementById("next").addEventListener("click",()=>{if("speechSynthesis" in window)speechSynthesis.cancel();draw();});
if("speechSynthesis" in window){chooseVoice();speechSynthesis.addEventListener?.("voiceschanged",chooseVoice);}
draw();
</script></body></html>
